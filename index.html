<!DOCTYPE html>
<html>
<head>
<title>Watchtower Beacon</title>

<style>
body {
    background-color: #0b1020;
    color: #e8f1ff;
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 50px;
}

h1 {
    font-size: 42px;
    letter-spacing: 4px;
}

h2 {
    color: #7dd3fc;
    font-weight: normal;
}

.beacon {
    margin: 40px auto;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 4px solid #7dd3fc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 70px;
    box-shadow: 0 0 30px #7dd3fc;
}

.status {
    font-size: 20px;
    margin: 20px;
}

button {
    background-color: #1e40af;
    color: white;
    border: 2px solid #7dd3fc;
    padding: 15px 35px;
    font-size: 18px;
    border-radius: 10px;
}

button:hover {
    cursor: pointer;
}
</style>

</head>

<body>

<h1>◈ WATCHTOWER BEACON ◈</h1>

<h2>Explorer Archive System</h2>

<div class="beacon">
◈
</div>

<div class="status" id="status">
SIGNAL STATUS: ONLINE
</div>

<div class="status" id="message">
AUTHENTICATION: VERIFIED
</div>

<button onclick="activateBeacon()">
ACTIVATE BEACON
</button>

<script>

const targetLatitude = 34.1619503;
const targetLongitude = -118.4434149;


function activateBeacon() {

document.getElementById("status").innerHTML =
"EXPLORER SIGNAL RECOGNIZED.";

document.getElementById("message").innerHTML =
"WATCHTOWER BEACON AWAKENED.<br><br>SEARCHING FOR COMMAND CENTRAL...";


if (navigator.geolocation) {

navigator.geolocation.getCurrentPosition(showLocation);

} else {

document.getElementById("message").innerHTML =
"LOCATION SYSTEM UNAVAILABLE.";

}

}


function showLocation(position) {

let playerLatitude = position.coords.latitude;
let playerLongitude = position.coords.longitude;


let distance = calculateDistance(
playerLatitude,
playerLongitude,
targetLatitude,
targetLongitude
);


document.getElementById("message").innerHTML =
"SIGNAL FOUND.<br><br>DISTANCE TO COMMAND CENTRAL: " +
distance.toFixed(0) +
" meters";

}


function calculateDistance(lat1, lon1, lat2, lon2) {

const earthRadius = 6371e3;

const radians = Math.PI / 180;

let a =
Math.sin((lat2-lat1)*radians/2) *
Math.sin((lat2-lat1)*radians/2) +
Math.cos(lat1*radians) *
Math.cos(lat2*radians) *
Math.sin((lon2-lon1)*radians/2) *
Math.sin((lon2-lon1)*radians/2);


let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

return earthRadius * c;

}

</script>

</body>
</html>
