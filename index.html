<!DOCTYPE html>
<html>
<head>
<title>Watchtower Beacon</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    background-color: #0b1020;
    color: #e8f1ff;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 30px 20px;
    min-height: 100vh;
}

h1 {
    font-size: 38px;
    letter-spacing: 3px;
    line-height: 1.2;
    margin-top: 20px;
}

h2 {
    color: #7dd3fc;
    font-size: 22px;
    font-weight: normal;
}

.beacon {
    margin: 50px auto;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: 5px solid #7dd3fc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 90px;
    box-shadow: 0 0 40px #7dd3fc;
}

.status {
    font-size: 24px;
    margin: 25px 0;
}

.message {
    font-size: 22px;
    line-height: 1.5;
}

button {

    margin-top: 35px;
    background-color: #1e40af;
    color: white;
    border: 3px solid #7dd3fc;
    padding: 22px 45px;
    font-size: 24px;
    border-radius: 15px;
    width: 90%;
    max-width: 350px;

}

button:hover {
    cursor: pointer;
}

</style>

</head>

<body>

<h1>◈ WATCHTOWER<br>BEACON ◈</h1>

<h2>Explorer Archive System</h2>

<div class="beacon">
◈
</div>

<div class="status" id="status">
SIGNAL STATUS: ONLINE
</div>

<div class="message" id="message">
AUTHENTICATION: VERIFIED
</div>


<button onclick="activateBeacon()">
ACTIVATE BEACON
</button>


<script>

const targetLatitude = 34.1619503;
const targetLongitude = -118.4434149;


function activateBeacon() {

document.getElementById("status").innerHTML =
"EXPLORER SIGNAL RECOGNIZED.";

document.getElementById("message").innerHTML =
"WATCHTOWER BEACON AWAKENED.<br><br>SEARCHING FOR COMMAND CENTRAL...";


if (navigator.geolocation) {

navigator.geolocation.getCurrentPosition(showLocation);

} else {

document.getElementById("message").innerHTML =
"LOCATION SYSTEM UNAVAILABLE.";

}

}


function showLocation(position) {

let playerLatitude = position.coords.latitude;
let playerLongitude = position.coords.longitude;


let distance = calculateDistance(
playerLatitude,
playerLongitude,
targetLatitude,
targetLongitude
);


document.getElementById("message").innerHTML =
"SIGNAL FOUND.<br><br>DISTANCE TO COMMAND CENTRAL:<br>" +
distance.toFixed(0) +
" meters";

}


function calculateDistance(lat1, lon1, lat2, lon2) {

const earthRadius = 6371e3;
const radians = Math.PI / 180;

let a =
Math.sin((lat2-lat1)*radians/2) *
Math.sin((lat2-lat1)*radians/2) +
Math.cos(lat1*radians) *
Math.cos(lat2*radians) *
Math.sin((lon2-lon1)*radians/2) *
Math.sin((lon2-lon1)*radians/2);


let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

return earthRadius * c;

}

</script>

</body>
</html>
